name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Produces a self-contained bundle per platform: the application plus a Java
# runtime, so it runs on a machine with no Java installed and no administrator
# rights.
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            archive: zip
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
          - os: macos-latest
            platform: mac-aarch64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/reference
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `clean` matters here: maven-shade reads the project artifact as its own
      # input, so packaging over a jar built for another platform yields one
      # carrying both platforms' native libraries.
      - name: Build jar
        shell: bash
        run: ./mvnw -B -DskipTests -Djavafx.platform=${{ matrix.platform }} clean package

      # jpackage requires a numeric --app-version. A tag supplies one; a manual
      # run does not, so fall back to the version in the pom.
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -1)
          fi
          echo "Resolved version: $version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Stage the jar on its own
        shell: bash
        run: mkdir -p staging && cp target/snackvar.jar staging/

      # --type app-image needs no installer framework and no elevation, unlike
      # --type msi or exe.
      #
      # The explicit module list trims the bundled runtime from ~180 MB to
      # ~76 MB. It is deliberately wider than jdeps reports, because jdeps
      # cannot see JavaFX (loaded from the classpath) or the reflective lookups
      # in FXML and ImageIO. The full test suite is run against this exact
      # runtime below, which is what actually establishes the set is complete.
      - name: Build app image
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name SnackVar \
            --app-version "$APP_VERSION" \
            --input staging \
            --main-jar snackvar.jar \
            --main-class com.opaleye.snackvar.Launcher \
            --dest dist \
            --vendor "SnackVar contributors" \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.prefs,java.scripting,java.sql,java.xml,java.management,java.compiler,jdk.jfr,jdk.unsupported,jdk.unsupported.desktop \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=zip-6"

      # Guards the trimmed module list: if stripping removed something the
      # application needs, this fails here rather than in front of a user.
      - name: Verify the trimmed runtime runs the whole test suite
        shell: bash
        run: |
          runtime=$(find dist -type d -name runtime | head -1)
          if [ -x "$runtime/bin/java" ]; then
            ./mvnw -B -Djvm="$runtime/bin/java" test
          else
            echo "no java launcher in the trimmed runtime; skipping"
          fi

      - name: Add a note about reference sequences
        shell: bash
        run: |
          target=$(ls -d dist/SnackVar* | head -1)
          cat > "$target/REFERENCE-SEQUENCES.txt" <<'NOTE'
          SnackVar reads reference sequences from, in order:

            1. a folder given with -Dsnackvar.referenceDir=<path>
            2. a "reference" folder next to the application
            3. %USERPROFILE%\.snackvar\reference   (or ~/.snackvar/reference)

          The complete RefSeq set (53,657 sequences, ~470 MB) is in the
          repository: https://github.com/abhirup780/SnackVar

          Use the green "Code" button, "Download ZIP" -- no Git and no
          administrator rights needed -- then copy the "reference" folder
          either next to this file or into option 3 above.

          Option 3 is the one to use with the single-file portable build,
          which runs from a temporary folder.
          NOTE

      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          name="snackvar-v${APP_VERSION}-${{ matrix.platform }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "../out/${name}.zip" . >/dev/null 2>&1 \
              || zip -qr "../out/${name}.zip" .)
          else
            tar -C dist -czf "out/${name}.tar.gz" .
          fi
          ls -la out

      # A single self-extracting executable, for when one file is wanted rather
      # than a folder. It unpacks to a temporary directory and launches, so
      # start-up is slower than the zip and reference sequences must live in
      # %USERPROFILE%\.snackvar\reference. Still no installer and no elevation.
      - name: Single-file portable exe
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 7zSD.sfx is the auto-run SFX module. It ships in the official LZMA
          # SDK from 7-zip.org; both the archive and the extracted module are
          # pinned by checksum.
          $sdk = 'lzma2301.7z'
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/$sdk" -OutFile $sdk
          $got = (Get-FileHash $sdk -Algorithm SHA256).Hash.ToLower()
          $want = '317dd834d6bbfd95433488b832e823cd3d4d420101436422c03af88507dd1370'
          if ($got -ne $want) { throw "LZMA SDK checksum mismatch: got $got" }

          7z e $sdk 'bin/7zSD.sfx' -y | Out-Null
          $sfxGot = (Get-FileHash '7zSD.sfx' -Algorithm SHA256).Hash.ToLower()
          $sfxWant = '436be3c4bada675a682802929384b548100f710b3ceaa87c9b2c7150963346b8'
          if ($sfxGot -ne $sfxWant) { throw "7zSD.sfx checksum mismatch: got $sfxGot" }

          7z a -t7z -mx=9 app.7z .\dist\SnackVar | Out-Null

          # Locate the launcher rather than assuming where it is: jpackage uses
          # a different layout per platform. On Windows the executable sits at
          # the top of the app folder (SnackVar\SnackVar.exe); on Linux it is
          # under bin/. Hardcoding the Linux path here shipped a portable exe
          # that extracted fine and then failed to start.
          $distRoot = (Resolve-Path .\dist).Path
          $exe = Get-ChildItem -Path .\dist -Filter 'SnackVar.exe' -Recurse -File |
                 Select-Object -First 1
          if (-not $exe) { throw 'SnackVar.exe not found in the app image' }
          $target = $exe.FullName.Substring($distRoot.Length + 1)
          Write-Host "Launcher inside the archive: $target"

          # Fail here rather than at the user's double-click.
          if (-not (7z l app.7z | Select-String -SimpleMatch $target)) {
            throw "RunProgram target '$target' is not present in app.7z"
          }

          # Backslashes are escaped in the SFX config format. String.Replace is
          # used rather than -replace: the latter takes a regex and a .NET
          # replacement string, where a backslash is literal, which makes the
          # correct number of them genuinely hard to get right.
          $escaped = $target.Replace('\', '\\')

          $config = @(
            ';!@Install@!UTF-8!',
            'Title="SnackVar"',
            "RunProgram=`"$escaped`"",
            'GUIMode="2"',
            ';!@InstallEnd@!'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText("$PWD\config.txt", $config + "`r`n")

          $out = "out\snackvar-v$env:APP_VERSION-win-portable.exe"
          cmd /c "copy /b 7zSD.sfx + config.txt + app.7z `"$out`"" | Out-Null

          # Read the RunProgram back out of the finished executable.
          $head = [System.IO.File]::ReadAllBytes($out)[0..200000]
          $text = [System.Text.Encoding]::ASCII.GetString($head)
          if ($text -notmatch 'RunProgram="([^"]*)"') { throw 'no RunProgram in the built exe' }
          $embedded = $Matches[1]
          Write-Host "Embedded RunProgram: $embedded"
          # Compare what the SFX will actually resolve, not the escaped text, so
          # an escaping mistake cannot pass by being wrong in both places.
          $resolved = $embedded.Replace('\\', '\')
          Write-Host "Resolves to: $resolved"
          if ($resolved -ne $target) { throw "RunProgram resolves to '$resolved', expected '$target'" }

          Get-Item $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: snackvar-${{ matrix.platform }}
          path: out/*

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
