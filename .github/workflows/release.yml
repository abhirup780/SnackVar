name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Produces a self-contained bundle per platform: the application plus a Java
# runtime, so it can be unzipped and run on a machine with no Java and no
# administrator rights.
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            archive: zip
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
          - os: macos-latest
            platform: mac-aarch64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/reference
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # javafx.platform selects which native libraries are bundled, so it must
      # match the machine the bundle is for.
      # `clean` matters here: maven-shade reads the project artifact as its own
      # input, so packaging over a jar built for another platform yields one
      # carrying both platforms' native libraries.
      - name: Build jar
        shell: bash
        run: ./mvnw -B -DskipTests -Djavafx.platform=${{ matrix.platform }} clean package

      - name: Stage the jar on its own
        shell: bash
        run: |
          mkdir -p staging
          cp target/snackvar.jar staging/

      # jpackage --type app-image needs no installer framework and no elevation,
      # unlike --type msi or exe.
      - name: Build app image
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name SnackVar \
            --app-version "${GITHUB_REF_NAME#v}" \
            --input staging \
            --main-jar snackvar.jar \
            --main-class com.opaleye.snackvar.Launcher \
            --dest dist \
            --vendor "SnackVar contributors"

      - name: Add a note about reference sequences
        shell: bash
        run: |
          target=$(ls -d dist/SnackVar* | head -1)
          cat > "$target/REFERENCE-SEQUENCES.txt" <<'NOTE'
          SnackVar reads reference sequences from a "reference" folder placed
          next to the application, or from a folder given with
          -Dsnackvar.referenceDir=<path>.

          The complete RefSeq set (53,657 sequences) is in the repository:
          https://github.com/abhirup780/SnackVar

          Download the repository ZIP from that page (no Git and no
          administrator rights needed), then copy its "reference" folder in
          beside this file.
          NOTE

      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          name="snackvar-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "../out/${name}.zip" . >/dev/null 2>&1 \
              || zip -qr "../out/${name}.zip" .)
          else
            tar -C dist -czf "out/${name}.tar.gz" .
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: snackvar-${{ matrix.platform }}
          path: out/*

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
